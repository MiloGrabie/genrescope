<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4e0">
  <title>GenreScope</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="GenreScope">
  <script>
    // Applique le thème choisi avant l'affichage pour éviter un flash.
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>Genre<span>Scope</span></h1>
      <button id="theme" class="theme" type="button" aria-label="Passer en mode nuit">☾</button>
    </header>

    <section class="result" aria-live="polite">
      <p class="family" id="family"></p>
      <p class="style" id="style">Prêt à écouter</p>
      <p class="status" id="status">Chargement du modèle…</p>
      <div class="progress" id="progress"><div id="progressBar"></div></div>
    </section>

    <ol class="ranking" id="ranking"></ol>

    <canvas id="viz" aria-hidden="true" hidden></canvas>

    <button id="listen" class="listen" disabled aria-pressed="false">
      <span class="dot"></span><span id="listenLabel">Écouter</span>
    </button>

    <footer>
      100&nbsp;% local, aucun son envoyé · Modèle
      <a href="https://essentia.upf.edu/models.html" target="_blank" rel="noopener">Discogs-EffNet</a>
      (MTG-UPF, CC&nbsp;BY-NC-SA)
    </footer>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
