name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Modèles mis en cache entre deux déploiements : le serveur du MTG est lent (MAEST ≈ 330 Mo).
      # Un cache par fichier : si un téléchargement échoue, rien n'est mis en cache et on réessaie au prochain.
      - uses: actions/cache@v4
        with:
          path: public/models/discogs-effnet-bsdynamic-1.onnx
          key: model-discogs-effnet-bsdynamic-1
      - uses: actions/cache@v4
        with:
          path: public/models/discogs-maest-5s-pw-2.onnx
          key: model-discogs-maest-5s-pw-2
      # --maest : modèle de test du menu caché (7 tapes sur le titre), non bloquant en cas d'échec
      - run: npm run setup -- --maest
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
